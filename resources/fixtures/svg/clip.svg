<?xml version="1.0" encoding="UTF-8"?>
<!-- SEAM test fixture (original). clipPath on an element and on a group, with transforms. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <clipPath id="c1"><rect x="0" y="0" width="30" height="30"/></clipPath>
  </defs>
  <rect id="clipped" x="0" y="0" width="60" height="60" fill="red" clip-path="url(#c1)"/>
  <g clip-path="url(#c1)" transform="translate(50 50)">
    <circle id="in_group" cx="10" cy="10" r="20" fill="blue"/>
  </g>
</svg>
