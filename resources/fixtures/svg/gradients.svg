<?xml version="1.0" encoding="UTF-8"?>
<!-- SEAM test fixture (original). Gradient units, href inheritance, stop opacity. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="lin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff0000"/>
      <stop offset="50%" stop-color="#00ff00" stop-opacity="0.5"/>
      <stop offset="1" style="stop-color:#0000ff"/>
    </linearGradient>
    <linearGradient id="user" gradientUnits="userSpaceOnUse" x1="50" y1="0" x2="50" y2="100" xlink:href="#lin"/>
    <radialGradient id="rad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="white"/>
      <stop offset="1" stop-color="black"/>
    </radialGradient>
  </defs>
  <rect id="a" x="0" y="0" width="40" height="40" fill="url(#lin)"/>
  <rect id="b" x="50" y="0" width="50" height="50" fill="url(#user)"/>
  <circle id="c" cx="25" cy="75" r="20" fill="url(#rad)"/>
</svg>
